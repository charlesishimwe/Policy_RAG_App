
name: PolicyCopilot CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py api.py ingest.py test_retrieval.py

      - name: Check required project files
        run: |
          test -f README.md
          test -f design-and-evaluation.md
          test -f ai-tooling.md
          test -d policies
